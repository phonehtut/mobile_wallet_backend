name: Laravel Sail Tests

on:
  push:
    branches: [ "DEV" ]
  pull_request:
    branches: [ "DEV" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Make Sail executable
        run: chmod +x vendor/bin/sail

      - name: Build and start Sail environment (PHP 8.4)
        run: ./vendor/bin/sail up -d --build

      - name: Install Composer dependencies inside Sail
        run: ./vendor/bin/sail composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: ./vendor/bin/sail artisan key:generate

      - name: Run migrations
        run: ./vendor/bin/sail artisan migrate --force

      - name: Run tests
        run: ./vendor/bin/sail test
